name: CI/CD Pipeline Scania

# 1. Quando o pipeline deve rodar - ser executado? No push - quando realizado - para  main do repositorio
on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest # neste caso, o github vai "ligar" uma "maquina" linux par anosso pipeline

steps:
    # passo 1 - baixar o código do repositorio para a "maquina" do Github
   - name: Checkout do código
     uses: actions/checkout@v4

    # passo 2 - fazer login no Docker hub usando as secrets que criamos
   - name: Login no Docker hub
     uses: docker/login-action@v3
     with: 
       username: ${{ secrets.DOCKER_USERNAME }}
       password: ${{ secrets.DOCKER_PASSWORD }}

    # passo 3: "buildar" a imagem e enviar (via push) automaticamente
   - name: Build e Push Docker imagem
     uses: docker/build-push-action@v5
     with: 
       context: .
       push: true
        # aqui, o contexto "ganha" a tag 'lastest' e também uma tag com o ID do commit 
       tags: |
          celiowillersouza/scania-devops:latest
          celiowillersouza/scania-devops:${{ github.sha }}
