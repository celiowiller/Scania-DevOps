name: CI/CD Pipeline Scania

# 1. Quando o pipeline deve rodar? No push para a branch main ou Modulo-1
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest # O GitHub vai ligar uma máquina Linux para nós

    steps:
      # Passo 1: Baixar o código do repositório para a máquina do GitHub
      - name: Checkout do código
        uses: actions/checkout@v4

      # Passo 2: Fazer login no Docker Hub usando as Secrets que criamos
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Passo 3: Buildar a imagem e enviar (Push) automaticamente
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Aqui ele gera a tag 'latest' e também uma tag com o ID do commit
          tags: |
            celiowillersouza/scania-devops:latest
            celiowillersouza/scania-devops:${{ github.sha }}