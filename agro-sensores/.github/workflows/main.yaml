name: CI/CD Pipeline Scania Backend

# 1. Quando o pipeline deve rodar - ser executado? No push - quando realizado - para  main do repositorio
on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
        # passo 1 - baixar o código do repositorio para a "maquina" do Github
      - name: Checkout do código
        uses: actions/checkout@v4
	
	    # passo 2 - configurar a JDK 21
      - name: Configurar a JDK java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
  # passo 3 - "buildar" o jar com o Maven
      - name: Build do código
        run: mvn clean package -DskipTests
  # passo 4 - login no Docker hub

  # passo 5  - fazer login no Docker hub usando as secrets que criamos
      - name: Login no Docker Hub
        uses: actions/login-action@v3
        with: 
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

  # passo 6: "buildar" a imagem e enviar (via push) automaticamente
      - name: Build e Push Docker imagem
        uses: docker/build-push-action@v5
        with: 
          context: .
          push: true
          # aqui, o contexto "ganha" a tag 'lastest' e também uma tag com o ID do commit 
          tags: |
            celiowillersouza/scania-api:latest
            